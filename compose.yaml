# Standalone OWI stack: UI container + Ollaya on the host.
# (A future all-in-one image with Ollaya inside is a separate step.)
services:
  ollaya-webui:
    build: .
    image: ollaya-webui:latest
    container_name: ollaya-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:11524:11524"
    environment:
      - OWI_CONFIG=/config/ollaya-webui.yaml
      - OWI_DB=/data/owi.db
      # Ollaya on the host. host.docker.internal resolves via extra_hosts below.
      - OLLAYA_BASE_URL=http://host.docker.internal:11435
      - OLLAYA_API_KEY=
      # MCP runs on the HOST (OWI starts `ollaya mcp` there only in bare-metal
      # mode). Point at a host MCP address only if one is already listening.
      - OLLAYA_MCP_ADDR=host.docker.internal:11436
      - OWI_TIMEOUT_S=300
      # Remote Ollaya host over SSH (key auth, admin sets host/user in UI too):
      # - OWI_REMOTE_HOST=192.168.50.57
      # - OWI_REMOTE_USER=tarcin
      # - OWI_REMOTE_KEY=/root/.ssh/id_ed25519
      # Mount a key if the container must SSH out, e.g.:
      # - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    volumes:
      # State (sqlite db, logs) + fallback config live OUTSIDE the image,
      # so rebuilds/upgrades keep everything. Code (incl. src/static UI)
      # is baked into the image via COPY — never mounted — so a new image
      # really means new code, with no host-checkout skew.
      - ./config:/config:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
