# Standalone OWI stack: UI container + Ollaya on the host.
# (A future all-in-one image with Ollaya inside is a separate step.)
services:
  ollaya-webui:
    build: .
    image: ollaya-webui:latest
    container_name: ollaya-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:11524:11524"
    environment:
      - OWI_CONFIG=/config/ollaya-webui.yaml
      - OWI_DB=/data/owi.db
      # Ollaya on the host. host.docker.internal resolves via extra_hosts below.
      - OLLAYA_BASE_URL=http://host.docker.internal:11435
      - OLLAYA_API_KEY=
      # MCP runs on the HOST (OWI starts `ollaya mcp` there only in bare-metal
      # mode). Point at a host MCP address only if one is already listening.
      - OLLAYA_MCP_ADDR=host.docker.internal:11436
      - OWI_TIMEOUT_S=300
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./src/static:/app/static:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
